name: BMC Seat Checker

on:
  # Schedule the workflow to run at specific times (in UTC)
  # 4:00 AM IST = 10:30 PM UTC (previous day)
  # 2:00 PM IST = 8:30 AM UTC
  # 8:30 PM IST = 3:00 PM UTC
  schedule:
    - cron: "30 22 * * *" # 4:00 AM IST
    - cron: "30 8 * * *" # 2:00 PM IST
    - cron: "0 15 * * *" # 8:30 PM IST

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  check-seats:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check BMC seat availability
        env:
          API_URL: ${{ secrets.API_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          CATEGORY_NAME: ${{ secrets.CATEGORY_NAME }}
          SERIAL_NO: ${{ secrets.SERIAL_NO }}
          PAGE_SIZE: ${{ secrets.PAGE_SIZE }}
          AUTH_KEY: ${{ secrets.AUTH_KEY }}
        run: npm start

      - name: 📊 Display results
        if: always()
        run: echo "✅ Seat check completed at $(date)"
