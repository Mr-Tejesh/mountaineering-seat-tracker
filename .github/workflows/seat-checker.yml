name: BMC Seat Checker

on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  check-seats:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check BMC seat availability
        env:
          API_URL: ${{ secrets.API_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          CATEGORY_NAME: ${{ secrets.CATEGORY_NAME }}
          SERIAL_NO: ${{ secrets.SERIAL_NO }}
          PAGE_SIZE: ${{ secrets.PAGE_SIZE }}
          AUTH_KEY: ${{ secrets.AUTH_KEY }}
        run: npm start

      - name: 📊 Display results
        if: always()
        run: echo "✅ Seat check completed at $(date)"
